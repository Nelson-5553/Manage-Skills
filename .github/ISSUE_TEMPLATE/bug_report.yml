name: Bug Report
description: Report a bug to help us improve
title: "[BUG] "
labels: ["bug"]

body:
  - type: textarea
    id: description
    attributes:
      label: Description
      placeholder: Clearly describe the bug
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. 
        2. 
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      placeholder: What did you expect to happen?

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      placeholder: What actually happened?

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: e.g., Windows 10, macOS, Linux

  - type: input
    id: vscode
    attributes:
      label: VS Code Version
      placeholder: e.g., 1.90.0

  - type: input
    id: extension
    attributes:
      label: Extension Version
      placeholder: e.g., 0.1.0

  - type: input
    id: node
    attributes:
      label: Node.js Version
      placeholder: e.g., 18.x

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      placeholder: Add screenshots or GIFs if applicable

  - type: textarea
    id: logs
    attributes:
      label: Logs
      placeholder: Paste relevant logs (Developer Tools)

  - type: textarea
    id: context
    attributes:
      label: Additional Context